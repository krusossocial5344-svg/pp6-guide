<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คู่มืออบรมครู ระบบ ปพ.6</title>
<meta name="description" content="คู่มือการใช้งานระบบ ปพ.6 ออนไลน์ โรงเรียนวัดบางปูน ฉบับเข้าใจง่าย พร้อมภาพหน้าจอจริง">
<meta name="theme-color" content="#7c0d14">
<meta property="og:title" content="คู่มืออบรมครูประจำชั้น ระบบ ปพ.6 · โรงเรียนวัดบางปูน">
<meta property="og:description" content="สอนทีละขั้น มีภาพหน้าจอและหมุดชี้ทุกขั้นตอน">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root {
  --red: #b0141d; --red-2: #d22a33; --deep: #6e0b12; --deeper: #3e060a;
  --gold: #e7c25d; --gold-2: #f3d98c; --gold-ink: #5b3f05; --cream: #fff8ee; --ink: #2b1517; --muted: #7d6164;
  --c1: #e2453c; --c2: #f08c2e; --c3: #e9b52d; --c4: #3aa76d; --c5: #2f9e9e; --c6: #3d7fd6; --c7: #7a5cd6; --c8: #c4489b; --c9: #a8141f;
  --bg: #f7ede2; --surface: #ffffff; --line: #ecd9c6;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "IBM Plex Sans Thai", system-ui, sans-serif; color: var(--ink); background: #1d0507; overflow: hidden; -webkit-font-smoothing: antialiased; }
h1, h2, h3, .disp { font-family: "Prompt", "IBM Plex Sans Thai", sans-serif; margin: 0; }

/* ===== โครงสไลด์ ===== */
.deck { position: fixed; inset: 0; }
.slide { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; opacity: 0; visibility: hidden; transform: translateX(40px); transition: opacity .45s ease, transform .45s ease, visibility 0s .45s;
  background: radial-gradient(900px 520px at 105% -10%, rgba(231, 194, 93, .35), transparent 60%), radial-gradient(800px 520px at -10% 110%, rgba(176, 20, 29, .12), transparent 60%), var(--bg);
  padding: clamp(18px, 3.2vw, 44px) clamp(16px, 4vw, 64px) 110px; }
.slide.on { opacity: 1; visibility: visible; transform: none; transition: opacity .45s ease, transform .45s ease; }
.slide.prev { transform: translateX(-40px); }
.slide.dark { color: #fff; background: radial-gradient(800px 500px at 100% 0%, rgba(255, 206, 110, .35), transparent 65%), radial-gradient(700px 500px at 0% 100%, rgba(255, 150, 110, .16), transparent 60%), linear-gradient(150deg, var(--deeper), var(--deep) 45%, var(--red) 80%, #c8682a); }
.inner { max-width: 1240px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

/* ===== หัวสไลด์ ===== */
.kicker { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: .9rem; color: var(--red); background: #fff; border-radius: 999px; padding: 5px 14px 5px 6px; box-shadow: 0 4px 14px rgba(124, 13, 20, .1); align-self: flex-start; }
.kicker b { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; border-radius: 999px; padding: 0 8px; color: #fff; background: linear-gradient(180deg, var(--red-2), var(--red)); font-family: Prompt; font-size: .82rem; }
.dark .kicker { background: rgba(255, 255, 255, .14); color: var(--gold-2); box-shadow: none; }
.title { font-size: clamp(1.7rem, 3.6vw, 2.9rem); line-height: 1.15; margin-top: 12px; color: var(--deep); font-weight: 700; }
.title em { font-style: normal; color: var(--red); }
.dark .title { color: #fff; } .dark .title em { color: var(--gold-2); }
.lead { font-size: clamp(1rem, 1.5vw, 1.18rem); color: var(--muted); margin: 8px 0 0; max-width: 820px; line-height: 1.6; }
.dark .lead { color: rgba(255, 236, 220, .9); }

/* ===== สไลด์ภาพหน้าจอ: ซ้ายขั้นตอน ขวาภาพ ===== */
.split { display: grid; grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.6fr); gap: clamp(18px, 3vw, 40px); align-items: center; margin-top: 18px; flex: 1; }
.split.wide { grid-template-columns: minmax(260px, .75fr) minmax(0, 1.8fr); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; background: #fff; border-radius: 16px; padding: 12px 14px; box-shadow: 0 1px 2px rgba(80, 10, 15, .05), 0 8px 22px rgba(80, 10, 15, .07); cursor: default; transition: transform .2s, box-shadow .2s; }
.steps li.hot { transform: translateX(4px); box-shadow: 0 0 0 2px var(--gold), 0 10px 26px rgba(124, 13, 20, .16); }
.num { flex: none; width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-family: Prompt; font-weight: 700; font-size: .95rem;
  background: linear-gradient(180deg, var(--red-2), var(--red)); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--gold); }
.steps div > b { display: block; font-family: Prompt; font-weight: 600; color: var(--deep); font-size: 1.04rem; }
.steps div > span { display: block; color: var(--muted); font-size: .93rem; line-height: 1.5; margin-top: 2px; }
.tip { margin-top: 12px; display: flex; gap: 10px; align-items: flex-start; background: linear-gradient(135deg, #fff6dc, #ffeec4); color: var(--gold-ink); border-radius: 16px; padding: 12px 14px; font-size: .93rem; line-height: 1.55; }
.tip::before { content: "💡"; font-size: 1.15rem; line-height: 1.3; }

/* กรอบจอคอม / มือถือ */
.screen { position: relative; border-radius: 16px; background: #fff; box-shadow: 0 30px 70px rgba(60, 6, 10, .28), 0 6px 18px rgba(60, 6, 10, .12); overflow: hidden; }
.screen .bar { height: 30px; background: #f2e6da; display: flex; align-items: center; gap: 7px; padding: 0 12px; }
.screen .bar i { width: 11px; height: 11px; border-radius: 50%; background: #e3b2a7; }
.screen .bar i:nth-child(2) { background: #ecd08a; } .screen .bar i:nth-child(3) { background: #a9d2a0; }
.screen .bar span { margin-left: 12px; flex: 1; max-width: 340px; height: 18px; border-radius: 9px; background: #fff; font-size: 11px; color: #9a8582; display: flex; align-items: center; padding: 0 10px; white-space: nowrap; overflow: hidden; }
.shot { position: relative; line-height: 0; }
.shot img { width: 100%; height: auto; display: block; }
.phone { position: relative; width: min(300px, 78vw); margin: 0 auto; border-radius: 42px; background: #1b0f11; padding: 11px; box-shadow: 0 30px 70px rgba(60, 6, 10, .35); }
.phone .shot { border-radius: 32px; overflow: hidden; }
.phones { display: flex; gap: clamp(10px, 2vw, 26px); justify-content: center; align-items: flex-start; flex-wrap: wrap; margin-top: 18px; }
.phones .phone { width: min(270px, 80vw); }

/* หมุดชี้ */
.mk { position: absolute; border-radius: 10px; box-shadow: 0 0 0 3px var(--gold), 0 0 0 7px rgba(231, 194, 93, .35); pointer-events: none; animation: glow 2.2s ease-in-out infinite; }
.mk.hot { box-shadow: 0 0 0 3px var(--red-2), 0 0 0 9px rgba(210, 42, 51, .3); }
.mk .num { position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; font-size: .85rem; pointer-events: auto; cursor: pointer; }
@keyframes glow { 50% { box-shadow: 0 0 0 3px var(--gold), 0 0 0 12px rgba(231, 194, 93, .12); } }
@media (prefers-reduced-motion: reduce) { .mk { animation: none; } .slide { transition: none; } }

/* ===== ปก ===== */
.cover { display: grid; grid-template-columns: 1fr 1.1fr; gap: 40px; align-items: center; flex: 1; }
.brand { display: flex; align-items: center; gap: 14px; }
.seal { width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #fbf1dc 70%, #f3e0b4); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0, 0, 0, .3); flex: none; }
.seal img { width: 52px; height: 52px; object-fit: contain; }
.brand b { font-family: Prompt; font-size: 1.4rem; display: block; line-height: 1.1; }
.brand span { color: var(--gold-2); }
.cover h1 { font-size: clamp(2rem, 4.4vw, 3.9rem); line-height: 1.05; margin-top: 22px; font-weight: 800; }
.cover h1 em { font-style: normal; color: var(--gold-2); white-space: nowrap; }
.cover p { font-size: clamp(1.05rem, 1.8vw, 1.3rem); color: rgba(255, 236, 220, .9); line-height: 1.6; }
.cta { display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; padding: 14px 26px; border-radius: 999px; background: linear-gradient(180deg, #f6dc8f, #dcae45); color: #4a1d06; font-family: Prompt; font-weight: 700; font-size: 1.1rem; border: 0; cursor: pointer; box-shadow: 0 10px 24px rgba(0, 0, 0, .25); }
.cover .screen { transform: perspective(1400px) rotateY(-10deg) rotateX(3deg); }

/* ===== ในกล่องมีอะไรบ้าง ===== */
.box { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-top: 22px; }
.item { background: #fff; border-radius: 20px; padding: 18px 16px; box-shadow: 0 1px 2px rgba(80, 10, 15, .05), 0 10px 26px rgba(80, 10, 15, .08); position: relative; overflow: hidden; }
.item::after { content: ""; position: absolute; right: -30px; top: -30px; width: 90px; height: 90px; border-radius: 50%; background: var(--c); opacity: .12; }
.item .ic { width: 50px; height: 50px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; background: var(--c); color: #fff; box-shadow: 0 8px 18px color-mix(in srgb, var(--c) 40%, transparent); }
.item b { display: block; font-family: Prompt; font-weight: 600; margin-top: 12px; font-size: 1.05rem; color: var(--deep); }
.item span { display: block; color: var(--muted); font-size: .9rem; margin-top: 3px; line-height: 1.45; }
.item .qty { position: absolute; right: 12px; top: 12px; font-family: Prompt; font-size: .78rem; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 12%, #fff); padding: 2px 9px; border-radius: 999px; z-index: 1; }

/* บทบาท */
.roles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 22px; }
.role { background: #fff; border-radius: 22px; padding: 20px; box-shadow: 0 10px 28px rgba(80, 10, 15, .08); border-top: 0; position: relative; overflow: hidden; }
.role .ic { width: 58px; height: 58px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 1.9rem; background: var(--c); }
.role h3 { margin-top: 12px; color: var(--deep); font-size: 1.2rem; }
.role ul { margin: 10px 0 0; padding-left: 18px; color: var(--muted); line-height: 1.8; font-size: .95rem; }

/* 9 ขั้น */
.nine { display: grid; grid-template-columns: repeat(9, 1fr); gap: 10px; margin-top: 22px; }
.st { background: #fff; border-radius: 18px; padding: 14px 10px; text-align: center; box-shadow: 0 10px 24px rgba(80, 10, 15, .08); position: relative; }
.st .n { width: 46px; height: 46px; margin: 0 auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-family: Prompt; font-weight: 700; font-size: 1.2rem; background: var(--c); box-shadow: 0 6px 14px color-mix(in srgb, var(--c) 45%, transparent); }
.st b { display: block; font-family: Prompt; font-weight: 600; font-size: .92rem; margin-top: 10px; color: var(--deep); line-height: 1.3; }
.st span { display: block; font-size: .78rem; color: var(--muted); margin-top: 4px; line-height: 1.35; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 18px; font-size: .95rem; color: var(--muted); }
.legend i { display: inline-block; width: 22px; height: 22px; border-radius: 50%; vertical-align: -6px; margin-right: 6px; }

/* เล่ม */
.pages { display: flex; justify-content: center; align-items: flex-end; margin-top: 26px; flex-wrap: wrap; gap: 10px; }
.pg { width: min(220px, 40vw); background: #fff; border-radius: 6px; box-shadow: 0 20px 40px rgba(60, 6, 10, .25); overflow: hidden; position: relative; }
.pg img { width: 100%; display: block; }
.pg em { position: absolute; left: 8px; bottom: 8px; font-style: normal; font-family: Prompt; font-size: .8rem; font-weight: 600; background: var(--red); color: #fff; border-radius: 999px; padding: 2px 10px; }
.toc-pages { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; justify-content: center; }
.toc-pages span { background: #fff; border-radius: 999px; padding: 6px 14px; font-size: .9rem; box-shadow: 0 4px 12px rgba(80, 10, 15, .06); }
.toc-pages b { color: var(--red); font-family: Prompt; margin-right: 4px; }

/* ปฏิทิน */
.timeline { margin-top: 22px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
.tl { background: #fff; border-radius: 18px; padding: 16px 14px; box-shadow: 0 10px 24px rgba(80, 10, 15, .08); position: relative; }
.tl .when { display: inline-block; font-family: Prompt; font-weight: 600; font-size: .82rem; color: #fff; background: var(--c); border-radius: 999px; padding: 3px 11px; }
.tl b { display: block; font-family: Prompt; margin-top: 10px; color: var(--deep); font-size: 1rem; }
.tl span { display: block; color: var(--muted); font-size: .88rem; margin-top: 4px; line-height: 1.5; }

/* คำถามพบบ่อย */
.faq { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
.qa { background: #fff; border-radius: 18px; padding: 14px 16px; box-shadow: 0 8px 22px rgba(80, 10, 15, .07); }
.qa b { display: flex; gap: 10px; font-family: Prompt; font-weight: 600; color: var(--deep); }
.qa b::before { content: "?"; flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--c, var(--red)); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: .85rem; }
.qa span { display: block; color: var(--muted); margin: 6px 0 0 36px; font-size: .93rem; line-height: 1.55; }

/* ปิดท้าย */
.end { text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.end .seal { width: 110px; height: 110px; } .end .seal img { width: 90px; height: 90px; }
.end h1 { font-size: clamp(2rem, 5vw, 3.6rem); font-weight: 800; }
.end .url { font-family: Prompt; font-weight: 600; font-size: clamp(1.1rem, 2.2vw, 1.5rem); background: rgba(255, 255, 255, .14); padding: 10px 22px; border-radius: 999px; color: var(--gold-2); }

/* ===== แถบควบคุม ===== */
.nav { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 8px; padding: 7px; border-radius: 999px;
  background: rgba(40, 6, 10, .82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0, 0, 0, .3); color: #fff; }
.nav button { border: 0; background: rgba(255, 255, 255, .1); color: #fff; height: 42px; min-width: 42px; border-radius: 999px; cursor: pointer; font: 600 .95rem "Prompt", sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; }
.nav button:hover { background: rgba(255, 255, 255, .2); }
.nav button:disabled { opacity: .35; cursor: default; }
.nav .next, .nav .next:hover { background: linear-gradient(180deg, #f3d27a, #d9a93c); color: #4a1d06; }
.nav .count { font: 600 .9rem Prompt, sans-serif; min-width: 64px; text-align: center; color: var(--gold-2); }
.nav svg { width: 18px; height: 18px; }
.progress { position: fixed; left: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--red-2), var(--gold)); z-index: 30; transition: width .4s; }
.toc { position: fixed; inset: 0; z-index: 40; background: rgba(25, 4, 6, .6); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 16px; }
.toc.on { display: flex; }
.toc .panel { background: #fff; border-radius: 22px; width: min(720px, 100%); max-height: 86vh; overflow: auto; padding: 20px; }
.toc h2 { color: var(--deep); font-size: 1.3rem; margin-bottom: 10px; }
.toc ol { margin: 0; padding: 0; list-style: none; columns: 2; column-gap: 16px; }
.toc li { break-inside: avoid; }
.toc a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; color: var(--ink); text-decoration: none; font-size: .95rem; }
.toc a:hover, .toc a.cur { background: #fbeaeb; color: var(--red); }
.toc a i { font-style: normal; font-family: Prompt; font-weight: 600; color: var(--red); min-width: 26px; }
.toc .sec { column-span: all; font-family: Prompt; font-weight: 600; color: var(--muted); font-size: .82rem; margin: 10px 10px 2px; }
.hint { position: fixed; right: 16px; top: 14px; z-index: 20; font-size: .8rem; color: rgba(255, 255, 255, .85); background: rgba(40, 6, 10, .55); padding: 6px 12px; border-radius: 999px; }

/* ===== ใหม่: ตัวติดตามขั้น / ลองทำ / QR / เช็กลิสต์ / กำหนดการ ===== */
.track { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.dots { display: inline-flex; gap: 5px; background: #fff; padding: 4px; border-radius: 999px; box-shadow: 0 4px 14px rgba(124, 13, 20, .1); }
.dots button { width: 26px; height: 26px; border-radius: 50%; border: 0; cursor: pointer; font: 700 .78rem Prompt, sans-serif; background: #f3e7dc; color: #a8908c; padding: 0; }
.dots button.done { background: linear-gradient(180deg, #f1cf7a, #c08a1e); color: #fff; }
.dots button.now { background: linear-gradient(180deg, var(--red-2), var(--red)); color: #fff; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--gold); }
.do { margin-top: 12px; display: flex; flex-direction: column; gap: 2px; background: linear-gradient(135deg, #e3f6ea, #cdeedb); border-radius: 16px; padding: 12px 16px; color: #17583a; border-left: 0; box-shadow: 0 8px 22px rgba(23, 88, 58, .1); }
.do b { font-family: Prompt; font-weight: 700; font-size: 1rem; }
.do span { font-size: .98rem; line-height: 1.5; }
.qrbox { margin-top: 12px; display: inline-flex; align-items: center; gap: 12px; background: #fff; border-radius: 16px; padding: 10px 16px 10px 10px; box-shadow: 0 8px 22px rgba(80, 10, 15, .08); }
.qrbox .qr { width: 92px; height: 92px; background: #fff; border-radius: 8px; padding: 4px; flex: none; }
.qrbox b { display: block; font-family: Prompt; color: var(--deep); }
.qrbox span { display: block; font-size: .88rem; color: var(--muted); }
.qrbox.dk { background: rgba(255, 255, 255, .12); margin-top: 18px; } .qrbox.dk b { color: #fff; } .qrbox.dk span { color: var(--gold-2); }
.cover-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; } .cover-row .cta { margin-top: 18px; }
.checks { display: grid; gap: 14px; margin-top: 20px; grid-template-columns: repeat(var(--cols, 2), 1fr); }
.checks.c3 { --cols: 3; } .chk-split .checks { --cols: 1; }
.cg { background: #fff; border-radius: 20px; padding: 16px; box-shadow: 0 10px 26px rgba(80, 10, 15, .08); }
.cgh { display: flex; align-items: center; gap: 10px; }
.cgh .ic { width: 42px; height: 42px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.3rem; background: color-mix(in srgb, var(--c) 16%, #fff); }
.cgh b { font-family: Prompt; font-size: 1.1rem; color: var(--deep); }
.cg ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.cg li { display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px; border-radius: 10px; cursor: pointer; font-size: .96rem; line-height: 1.45; user-select: none; }
.cg li:hover { background: #fbf4ec; }
.cg li i { flex: none; width: 22px; height: 22px; border-radius: 7px; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 55%, #fff); margin-top: 1px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-style: normal; font-size: .8rem; transition: background .15s; }
.cg li.ok i { background: var(--c); box-shadow: none; } .cg li.ok i::before { content: "✓"; font-weight: 700; }
.cg li.ok span { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--c) 60%, transparent); }
.chk-split { align-items: start; }
.agenda { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; max-width: 980px; }
.ag { display: grid; grid-template-columns: auto 110px 1fr auto; gap: 16px; align-items: center; background: #fff; border-radius: 18px; padding: 12px 18px 12px 12px; text-decoration: none; color: inherit; box-shadow: 0 8px 22px rgba(80, 10, 15, .07); transition: transform .15s; }
.ag:hover { transform: translateX(4px); }
.ag .no { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font: 700 1.1rem Prompt, sans-serif; color: #fff; background: var(--c); }
.ag .tm { font: 600 .95rem Prompt, sans-serif; color: var(--c); background: color-mix(in srgb, var(--c) 12%, #fff); border-radius: 999px; padding: 4px 12px; text-align: center; }

const TL = [["พ.ค.", "ต้นปีการศึกษา", "ตรวจรายชื่อ อัปโหลดรูป กรอกข้อมูลนักเรียน (ขั้น 1)", "--c6"], ["ทุกเดือน", "สิ้นเดือน", "กรอกเวลาเรียน (ขั้น 2)", "--c5"], ["ระหว่างภาค", "ทยอยทำ", "คุณลักษณะ ประเมินอื่น หน้าที่ ความเห็น (ขั้น 4–7)", "--c4"], ["ปลายภาค", "ได้ใบเกรดแล้ว", "อัปโหลดใบเกรด (ขั้น 3)", "--c3"], ["ส่งเล่ม", "หลังสอบ", "พิมพ์เล่ม แจกนักเรียน (ขั้น 8)", "--c2"], ["1–2 สัปดาห์", "หลังส่งเล่ม", "รับเล่มคืน สแกนอัปโหลด (ขั้น 9)", "--c1"], ["ปีถัดไป", "เลื่อนชั้น", "ข้อมูลเดิมอยู่ครบ ทำต่อในเล่มเดิม", "--c9"]];
const FAQ = [["ลืมรหัสผ่าน", "แจ้งผู้ดูแล กด \"ตั้งรหัสใหม่\" แล้วเปลี่ยนเป็นรหัสของตัวเอง"], ["ขึ้นว่ารหัสผ่านไม่ถูกต้อง", "กดรูปตาดูว่าพิมพ์ถูกไหม ตรวจ Caps Lock"], ["เข้าระบบไม่ได้ / network", "กด Ctrl + F5 · ลองหน้าต่างไม่ระบุตัวตน · ลองเน็ตมือถือ"], ["เปิดจาก LINE แล้วเข้าไม่ได้", "กด ⋮ › เปิดในเบราว์เซอร์ หรือใช้ชื่อผู้ใช้แทน"], ["ใบเกรดไม่ผ่านคุณภาพ", "ใช้ไฟล์ PDF จากโปรแกรม หรือถ่ายใหม่ให้ชัด"], ["พิมพ์แล้วหน้าเกิน", "A4 · ขอบ = ไม่มี · ขนาด 100% หรือพิมพ์จาก PDF"], ["สแกน QR ไม่ได้", "สแกน 200 dpi ขึ้นไป อย่าให้ QR พับหรือมีรอยปากกา"], ["ไม่เห็นห้องของตัวเอง / ช่องแก้ไม่ได้", "ภาคเรียนถูกล็อก หรือยังไม่ได้ผูกห้อง แจ้งผู้ดูแล"]];

// ===== วาดสไลด์ =====
const esc = (s) => String(s);
const kick = (k, i) => `<div class="kicker"><b>${i}</b>${k}</div>`;
const firstOfStep = (st) => S.findIndex((x) => x.st === st);
const track = (st) => `<div class="track"><span class="kicker"><b>ขั้นที่ ${st}</b>จาก 9 · ${NINE[st - 1][0]}</span><span class="dots">${NINE.map((x, j) => `<button class="${j + 1 < st ? "done" : j + 1 === st ? "now" : ""}" data-go="${firstOfStep(j + 1)}" title="ขั้นที่ ${j + 1} ${x[0]}">${j + 1 < st ? "✓" : j + 1}</button>`).join("")}</span></div>`;
const head = (s, n) => s.st ? track(s.st) : kick(s.k, n);
const qrBox = (dark) => `<div class="qrbox ${dark ? "dk" : ""}"><img class="qr" src="img/qr.svg" alt="QR เข้าระบบ"><div><b>สแกนเพื่อเปิดระบบ</b><span>${URL_SYS}</span></div></div>`;
const doBox = (t) => t ? `<div class="do"><b>✋ ลองทำเลย</b><span>${t}</span></div>` : "";
function marksHtml(name, n) {
  const M = MARKS[name]; if (!M) return "";
  return M.m.slice(0, n).map((m, i) => m ? `<div class="mk" data-i="${i}" style="left:${m.x}%;top:${m.y}%;width:${m.w}%;height:${m.h}%"><span class="num">${i + 1}</span></div>` : "").join("");
}
const desk = (name, n) => `<div class="screen"><div class="bar"><i></i><i></i><i></i><span>${URL_SYS}</span></div><div class="shot"><img src="img/${name}.webp" alt="" loading="lazy" width="${MARKS[name]?.w || 1280}" height="${MARKS[name]?.h || 800}">${marksHtml(name, n)}</div></div>`;
const phone = (name, n) => `<div class="phone"><div class="shot"><img src="img/${name}.webp" alt="" loading="lazy">${marksHtml(name, n)}</div></div>`;

function render(s, i) {
  const n = i + 1;
  switch (s.type) {
    case "cover": return `<section class="slide dark"><div class="inner"><div class="cover">
      <div><div class="brand"><div class="seal"><img src="img/logo.png" alt="ตราโรงเรียน"></div><div><b>ระบบ ปพ.6</b><span>โรงเรียนวัดบางปูน</span></div></div>
        <h1>อบรมการใช้งาน<br><em>สำหรับครูประจำชั้น</em></h1>
        <p>สอนทีละขั้น ทำตามบนเครื่องของตัวเองไปพร้อมกัน<br>มีภาพหน้าจอจริง และหมุดตัวเลขชี้ว่าต้องกดตรงไหน</p>
        <div class="cover-row"><button class="cta" data-go="1">เริ่มอบรม →</button>${qrBox(1)}</div></div>
      <div>${desk("landing", 0)}</div></div></div></section>`;
    case "box": return `<section class="slide"><div class="inner">${kick(s.k, "📦")}<h2 class="title">${s.title}</h2><p class="lead">${s.lead}</p>
      <div class="box">${BOX.map(([ic, b, sp, c, q]) => `<div class="item" style="--c:var(${c})">${q ? `<span class="qty">${q}</span>` : ""}<div class="ic">${ic}</div><b>${b}</b><span>${sp}</span></div>`).join("")}</div></div></section>`;
    case "check": return `<section class="slide"><div class="inner">${kick(s.k, n)}<h2 class="title">${s.title}</h2><p class="lead">${s.lead}</p>
      <div class="${s.img ? "split chk-split" : ""}"><div><div class="checks c${s.groups.length}">${s.groups.map(([ic, h, c, li]) => `<div class="cg" style="--c:var(${c})"><div class="cgh"><span class="ic">${ic}</span><b>${h}</b></div><ul>${li.map((x) => `<li tabindex="0"><i></i><span>${x}</span></li>`).join("")}</ul></div>`).join("")}</div>
      ${s.tip ? `<div class="tip">${s.tip}</div>` : ""}</div>${s.img ? `<div class="media">${desk(s.img, 0)}</div>` : ""}</div></div></section>`;
    case "agenda": return `<section class="slide"><div class="inner">${kick(s.k, "⏱")}<h2 class="title">${s.title}</h2><p class="lead">${s.lead}</p>
      <div class="agenda">${AGENDA.map(([tm, h, d, c, t], j) => `<a class="ag" href="#" data-go="${S.findIndex((x) => x.t === t)}" style="--c:var(${c})"><span class="no">${j + 1}</span><span class="tm">${tm}</span><div><b>${h}</b><span>${d}</span></div><span class="go">ไปที่สไลด์ ›</span></a>`).join("")}</div></div></section>`;
    case "screen": return `<section class="slide"><div class="inner">${head(s, n)}<h2 class="title">${s.title}</h2>${s.lead ? `<p class="lead">${s.lead}</p>` : ""}
      <div class="split ${s.steps.length <= 2 ? "wide" : ""}"><div><p class="walk"><span>▶</span> กด <b>ถัดไป</b> เพื่อชี้ทีละจุด</p><ol class="steps walkable">${s.steps.map(([b, sp], j) => `<li data-i="${j}"><span class="num">${j + 1}</span><div><b>${b}</b><span>${sp}</span></div></li>`).join("")}</ol>
        ${doBox(s.do)}${s.tip ? `<div class="tip">${s.tip}</div>` : ""}${s.qr ? qrBox() : ""}</div>
        <div class="media">${desk(s.img, s.steps.length)}</div></div></div></section>`;
    case "nine": return `<section class="slide"><div class="inner">${kick(s.k, n)}<h2 class="title">${s.title}</h2><p class="lead">${s.lead}</p>
      <div class="nine">${NINE.map(([b, sp], j) => `<div class="st" style="--c:var(--c${j + 1})"><div class="n">${j + 1}</div><b>${b}</b><span>${sp}</span></div>`).join("")}</div>
      <div class="legend"><span><i style="background:linear-gradient(180deg,#f1cf7a,#c08a1e)"></i>วงสีทอง = ทำเสร็จแล้ว</span><span><i style="background:#fff;box-shadow:inset 0 0 0 3px #b0141d"></i>วงขอบแดง = ขั้นที่ต้องทำต่อ</span><span><i style="background:#fff;box-shadow:inset 0 0 0 3px #ecd9c6"></i>วงเทา = ยังไม่ถึง</span></div>
      <div style="margin-top:18px">${desk("t-info", 1)}</div></div></section>`;
    case "book": return `<section class="slide"><div class="inner">${head(s, n)}<h2 class="title">${s.title}</h2><p class="lead">${s.lead}</p>
      <div class="pages">${[["page-1", "ปกหน้า"], ["page-4", "ใบแสดงผลการเรียน"], ["page-7", "คุณลักษณะ"], ["page-10", "ความคิดเห็น"]].map(([f, l], j) => `<div class="pg" style="transform:rotate(${[-5, -1.5, 1.5, 5][j]}deg)"><img src="img/book-${f}.webp" alt="${l}" loading="lazy"><em>${l}</em></div>`).join("")}</div>
      <div class="toc-pages">${["ปกหน้า", "คำชี้แจง", "ข้อมูลส่วนตัว / เวลาเรียน", "ใบแสดงผลการเรียนทุกปีทุกภาค", "คุณลักษณะ / การประเมิน", "ความเห็นครู", "ความเห็นผู้ปกครอง", "ความคิดเห็นเกี่ยวกับนักเรียน", "ปกหลัง"].map((x, j) => `<span><b>${j + 1}</b>${x}</span>`).join("")}</div></div></section>`;
    case "phones": return `<section class="slide"><div class="inner">${kick(s.k, n)}<h2 class="title">${s.title}</h2><p class="lead">${s.lead}</p>
      <div class="phones">${s.phones.map(([img, labels]) => `<div><div>${phone(img, labels.length)}</div><ol class="steps" style="margin-top:14px;max-width:290px">${labels.map((l, j) => `<li data-i="${j}"><span class="num">${j + 1}</span><div><b>${l}</b></div></li>`).join("")}</ol></div>`).join("")}</div><div style="max-width:560px;margin:8px auto 0;width:100%">${doBox(s.do)}</div></div></section>`;
    case "timeline": return `<section class="slide"><div class="inner">${kick(s.k, n)}<h2 class="title">${s.title}</h2>
      <div class="timeline">${TL.map(([w, b, sp, c]) => `<div class="tl" style="--c:var(${c})"><span class="when">${w}</span><b>${b}</b><span>${sp}</span></div>`).join("")}</div></div></section>`;
    case "faq": return `<section class="slide"><div class="inner">${kick(s.k, n)}<h2 class="title">${s.title}</h2>
      <div class="faq">${FAQ.map(([q, a], j) => `<div class="qa" style="--c:var(--c${(j % 9) + 1})"><b>${q}</b><span>${a}</span></div>`).join("")}</div></div></section>`;
    case "end": return `<section class="slide dark"><div class="inner"><div class="end"><div class="seal"><img src="img/logo.png" alt="ตราโรงเรียน"></div>
      <h1>พร้อมใช้งานแล้ว 🎉</h1><p class="lead" style="text-align:center">กลับไปทำห้องของตัวเองต่อได้เลย ติดตรงไหน ดูเมนู "คู่มือ" ในระบบ หรือถามผู้ดูแลระบบของโรงเรียน</p>
      <div class="url">${URL_SYS}</div><p class="lead" style="text-align:center;margin-top:20px">พัฒนาโดย เพจตามติดชีวิต KruSos</p>
      <button class="cta" data-go="0">กลับไปหน้าแรก</button></div></div></section>`;
  }
}

const deck = document.getElementById("deck");
deck.innerHTML = S.map(render).join("");
const slides = [...deck.children];
let cur = 0;
function show(i, push = true) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, k) => { s.classList.toggle("on", k === i); s.classList.toggle("prev", k < i); });
  if (slides[cur] && cur !== i) { slides[cur].classList.remove("walking"); slides[cur].querySelectorAll(".cur").forEach((x) => x.classList.remove("cur")); slides[cur].querySelectorAll(".zoom").forEach((z) => z.classList.remove("on")); }
  cur = i; sub = -1; slides[i].scrollTop = 0;
  document.getElementById("cnt").textContent = `${i + 1} / ${slides.length}`;
  document.getElementById("prog").style.width = `${(i + 1) / slides.length * 100}%`;
  document.getElementById("bPrev").disabled = i === 0;
  document.getElementById("bNext").disabled = false;
  if (push) history.replaceState(null, "", `#${i + 1}`);
  [...document.querySelectorAll("#tocList a")].forEach((a) => a.classList.toggle("cur", +a.dataset.go === i));
  // โหลดภาพของสไลด์ถัดไปไว้ก่อน
  slides[i + 1]?.querySelectorAll("img[loading=lazy]").forEach((im) => (im.loading = "eager"));
}
// ===== ชี้ทีละจุด: กดถัดไปแล้วหมุดถัดไปสว่าง ที่เหลือมืดลง =====
let sub = -1;
const walkList = () => slides[cur].querySelector(".steps.walkable");
function zoomFor(sl, k) {
  const mk = sl.querySelector(`.screen .mk[data-i="${k}"]`); const shot = mk?.closest(".shot"); if (!shot) return;
  let z = shot.querySelector(".zoom"); if (!z) { z = document.createElement("div"); z.className = "zoom"; z.innerHTML = "<i></i><span>ซูม</span>"; shot.appendChild(z); }
  const W = shot.clientWidth, H = shot.clientHeight, f = (v) => parseFloat(v) / 100;
  let x = f(mk.style.left), y = f(mk.style.top), w = f(mk.style.width), h = f(mk.style.height);
  const cx = x + w / 2, cy = y + h / 2;
  let rw = Math.max(w + 0.06, 0.2), rh = Math.max(h + 0.06 * W / H, rw * W / H * 0.45);
  if (rh * H > rw * W * 1.1) rw = rh * H / W / 1.1;           // ไม่ให้สูงเกินไป
  rw = Math.min(rw, 0.9); rh = Math.min(rh, 0.9);
  let rx = Math.min(Math.max(cx - rw / 2, 0), 1 - rw), ry = Math.min(Math.max(cy - rh / 2, 0), 1 - rh);
  const zw = Math.min(0.42, 0.62 * rw * 2.4) , zh = zw * W * (rh * H) / (rw * W) / H;   // ขยายประมาณ 2 เท่า
  const img = shot.querySelector("img").src;
  z.querySelector("i").style.cssText = `background-image:url("${img}");background-size:${100 / rw}% ${100 / rh}%;background-position:${rw >= 1 ? 0 : rx / (1 - rw) * 100}% ${rh >= 1 ? 0 : ry / (1 - rh) * 100}%`;
  z.style.width = zw * 100 + "%"; z.style.height = Math.min(zh, 0.8) * 100 + "%";
  z.style.left = cx < 0.5 ? "auto" : "3%"; z.style.right = cx < 0.5 ? "3%" : "auto";
  z.style.top = cy < 0.5 ? "auto" : "4%"; z.style.bottom = cy < 0.5 ? "4%" : "auto";
  z.classList.add("on");
}
function setSub(k) {
  const sl = slides[cur], ol = walkList(); sub = k;
  sl.classList.toggle("walking", k >= 0);
  sl.querySelectorAll(".cur").forEach((x) => x.classList.remove("cur"));
  sl.querySelectorAll(".zoom").forEach((z) => z.classList.remove("on"));
  if (!ol || k < 0) return;
  sl.querySelectorAll(`.steps.walkable li[data-i="${k}"], .screen .mk[data-i="${k}"]`).forEach((x) => x.classList.add("cur"));
  ol.querySelector(`li[data-i="${k}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
  zoomFor(sl, k);
}
function next() { const ol = walkList(); const n = ol ? ol.children.length : 0; if (sub < n - 1) setSub(sub + 1); else show(cur + 1); }
function prev() { if (sub >= 0) setSub(sub - 1); else show(cur - 1); }
document.getElementById("bPrev").onclick = prev;
document.getElementById("bNext").onclick = next;
document.addEventListener("click", (e) => { const li = e.target.closest(".steps.walkable li, .screen .mk .num"); if (!li) return; const i = +(li.closest("li") || li.closest(".mk")).dataset.i; setSub(sub === i ? -1 : i); });
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  if (e.key === "Home") show(0); if (e.key === "End") show(slides.length - 1);
  if (e.key === "Escape") toc.classList.remove("on");
});
// ปัดซ้าย/ขวาบนมือถือ
let tx = 0, ty = 0;
deck.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
deck.addEventListener("touchend", (e) => { const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) (dx < 0 ? next : prev)(); }, { passive: true });
// สารบัญ
const toc = document.getElementById("toc");
document.getElementById("tocList").innerHTML = S.map((s, i) => `${s.sec ? `<li class="sec">${s.sec}</li>` : ""}<li><a href="#${i + 1}" data-go="${i}"><i>${i + 1}</i>${s.t}</a></li>`).join("");
document.getElementById("bToc").onclick = () => toc.classList.add("on");
toc.addEventListener("click", (e) => { if (e.target === toc) toc.classList.remove("on"); });
document.addEventListener("click", (e) => { const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); toc.classList.remove("on"); show(+g.dataset.go); } });
// ชี้ขั้นตอนแล้วหมุดบนภาพเด่นขึ้น (และกลับกัน)
document.addEventListener("pointerover", (e) => {
  const li = e.target.closest(".steps li, .mk .num"); const sl = slides[cur];
  sl.querySelectorAll(".hot").forEach((x) => x.classList.remove("hot"));
  if (!li) return;
  const i = (li.closest("li") || li.closest(".mk")).dataset.i, box = li.closest(".phones > div") || sl;
  box.querySelectorAll(`.steps li[data-i="${i}"], .mk[data-i="${i}"]`).forEach((x) => x.classList.add("hot"));
});
show(Math.max(0, (parseInt(location.hash.slice(1)) || 1) - 1), false);
// ติ๊กเช็กลิสต์
document.addEventListener("click", (e) => { const li = e.target.closest(".cg li"); if (li) li.classList.toggle("ok"); });
document.addEventListener("keydown", (e) => { const li = e.target.closest?.(".cg li"); if (li && (e.key === "Enter")) li.classList.toggle("ok"); });
</script>
</body>
</html>
